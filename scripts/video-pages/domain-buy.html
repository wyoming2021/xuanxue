<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>域名购买</title>
<style>
  body{margin:0;font-family:'Microsoft YaHei',sans-serif;background:#f9fafb;color:#111;}
  .top{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 40px;display:flex;align-items:center;gap:28px;font-size:15px;}
  .logo{font-size:20px;font-weight:700;color:#f97316;}
  .nav a{margin-right:20px;color:#6b7280;text-decoration:none;}
  .wrap{max-width:1000px;margin:56px auto;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:40px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
  h1{font-size:24px;margin:0 0 24px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .input{flex:1;padding:14px 16px;border:1px solid #d1d5db;border-radius:10px;font-size:18px;background:#f3f4f6;color:#374151;}
  .price{font-size:22px;color:#f97316;font-weight:700;}
  .btn{background:#f97316;color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:600;cursor:pointer;}
  table{width:100%;border-collapse:collapse;margin-top:12px;}
  th,td{border-bottom:1px solid #e5e7eb;padding:14px 16px;text-align:left;font-size:15px;color:#374151;}
  th{color:#6b7280;font-weight:600;background:#fafafa;}
  .badge{background:#fee2e2;color:#ef4444;padding:4px 12px;border-radius:999px;font-size:13px;}
  .ok{color:#16a34a;}
</style>
</head>
<body>
  <div class="top"><span class="logo">Namesilo</span><nav class="nav"><a>域名</a><a>主机</a><a>我的账户</a></nav></div>
  <div class="wrap">
    <h1>购买域名</h1>
    <div class="row">
      <div class="input">myxuan.site</div>
      <span class="price">¥ 68 / 年</span>
      <button class="btn">加入购物车</button>
    </div>
    <table>
      <tr><th>域名</th><th>注册年限</th><th>价格</th><th>状态</th></tr>
      <tr><td>myxuan.site</td><td>1 年</td><td>¥ 68</td><td><span class="badge">待付款</span></td></tr>
      <tr><td class="ok">说明：买一个 .site / .com 域名，一年约 50-100 元</td><td></td><td></td><td></td></tr>
    </table>
  </div>
</body>
</html>
