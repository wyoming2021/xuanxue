<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网站管理后台</title>
<style>
  body{margin:0;font-family:'Microsoft YaHei',sans-serif;background:#f8fafc;color:#111;}
  .top{background:#1c1917;color:#fff;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;}
  .logo{font-size:18px;font-weight:700;}
  .user{font-size:14px;color:#d6d3d1;}
  .wrap{display:flex;min-height:calc(100vh - 56px);}
  .side{width:200px;background:#292524;color:#d6d3d1;padding-top:20px;font-size:15px;}
  .side .item{padding:13px 24px;cursor:pointer;}
  .side .item.sel{background:#44403c;color:#fff;border-left:3px solid #f59e0b;}
  .main{flex:1;padding:32px 40px;}
  h1{font-size:22px;margin:0 0 20px;}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(79,70,229,.3);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;}
  th{background:#fafafa;color:#6b7280;font-size:13px;padding:12px 16px;text-align:left;border-bottom:1px solid #e5e7eb;}
  td{padding:14px 16px;border-bottom:1px solid #f3f4f6;font-size:15px;color:#374151;}
  .status{background:#ecfdf5;color:#059669;padding:3px 10px;border-radius:999px;font-size:13px;}
  .ai-btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
  <div class="top"><span class="logo">🔮 玄语管理后台</span><span class="user">admin@example.com</span></div>
  <div class="wrap">
    <div class="side">
      <div class="item sel">📝 文章管理</div>
      <div class="item">💬 评论</div>
      <div class="item">👥 用户</div>
      <div class="item">⚙️ 设置</div>
    </div>
    <div class="main">
      <div class="row">
        <h1>文章管理</h1>
        <button class="ai-btn">✨ AI 写文章（每天自动更新）</button>
      </div>
      <table>
        <tr><th>标题</th><th>状态</th><th>发布时间</th></tr>
        <tr><td>每日十二星座运势指南：读懂今天的好运与提醒</td><td><span class="status">已发布</span></td><td>2026-10-11</td></tr>
        <tr><td>2026年射手座全年运势详解</td><td><span class="status">已发布</span></td><td>2026-10-10</td></tr>
        <tr><td>八字入门：如何看懂自己的四柱</td><td><span class="status">已发布</span></td><td>2026-10-09</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
